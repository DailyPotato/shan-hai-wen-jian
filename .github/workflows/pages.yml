name: Verify and publish 山海问剑
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify JavaScript and gameplay
        run: |
          node --check content.js
          node --check engine.js
          node --check renderer.js
          node --check app.js
          node --check server.cjs
          node --test tests/*.test.cjs
      - name: Assemble static game
        run: |
          mkdir -p _site/assets
          cp index.html style.css content.js engine.js renderer.js app.js .nojekyll _site/
          cp assets/favicon.svg assets/cover.png assets/pine.png assets/cultivator.png _site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
